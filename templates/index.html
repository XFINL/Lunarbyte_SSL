
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一鍵免費SSL申請</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-gray-50">
    <div id="app" class="min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-gradient-to-r from-blue-600 to-blue-700 text-white shadow-lg">
            <div class="container mx-auto px-4 py-6">
                <h1 class="text-3xl font-bold">🔐 一鍵免費SSL申請</h1>
                <p class="text-blue-100 mt-2">快速申請ZeroSSL或Let's Encrypt免費證書</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-grow container mx-auto px-4 py-12">
            <!-- Step 1: Form -->
            <div id="step-form" class="step">
                <div class="max-w-2xl mx-auto">
                    <div class="bg-white rounded-2xl shadow-xl p-8">
                        <h2 class="text-2xl font-bold text-gray-800 mb-2">申請SSL證書</h2>
                        <p class="text-gray-600 mb-8">填寫以下資訊開始申請您的免費SSL證書</p>
                        
                        <form id="ssl-form">
                            <div class="mb-6">
                                <label for="domain" class="block text-sm font-medium text-gray-700 mb-2">域名 (Domain)</label>
                                <input type="text" id="domain" name="domain" required
                                    class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:outline-none transition"
                                    placeholder="example.com">
                            </div>

                            <div class="mb-6">
                                <label for="ca" class="block text-sm font-medium text-gray-700 mb-2">SSL 服務商</label>
                                <select id="ca" name="ca"
                                    class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:outline-none transition">
                                    <option value="letsencrypt_staging">Let's Encrypt (Staging - 測試用)</option>
                                    <option value="letsencrypt">Let's Encrypt (正式)</option>
                                    <option value="zerossl">ZeroSSL</option>
                                </select>
                            </div>

                            <div class="mb-8">
                                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">聯絡Email (選填)</label>
                                <input type="email" id="email" name="email"
                                    class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:outline-none transition"
                                    placeholder="admin@example.com">
                            </div>

                            <button type="submit"
                                class="w-full bg-gradient-to-r from-blue-600 to-blue-700 text-white py-4 px-6 rounded-xl font-semibold text-lg shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition">
                                開始申請 →
                            </button>
                        </form>
                    </div>

                    <!-- Features -->
                    <div class="mt-8 grid md:grid-cols-3 gap-4">
                        <div class="bg-white rounded-xl p-6 shadow-md">
                            <div class="text-3xl mb-3">⚡</div>
                            <h3 class="font-bold text-gray-800">快速申請</h3>
                            <p class="text-gray-600 text-sm mt-2">只需幾分鐘即可完成</p>
                        </div>
                        <div class="bg-white rounded-xl p-6 shadow-md">
                            <div class="text-3xl mb-3">🛡️</div>
                            <h3 class="font-bold text-gray-800">完全免費</h3>
                            <p class="text-gray-600 text-sm mt-2">零費用，90天有效期</p>
                        </div>
                        <div class="bg-white rounded-xl p-6 shadow-md">
                            <div class="text-3xl mb-3">📋</div>
                            <h3 class="font-bold text-gray-800">簡單操作</h3>
                            <p class="text-gray-600 text-sm mt-2">無須技術背景</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Step 2: Verification -->
            <div id="step-verify" class="step hidden">
                <div class="max-w-3xl mx-auto">
                    <div class="bg-white rounded-2xl shadow-xl p-8">
                        <div class="flex items-center mb-6">
                            <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white font-bold mr-3">2</div>
                            <h2 class="text-2xl font-bold text-gray-800">驗證域名所有權</h2>
                        </div>

                        <div id="verification-content" class="mb-8"></div>

                        <div class="flex flex-col sm:flex-row gap-4">
                            <button id="check-btn"
                                class="flex-1 bg-gradient-to-r from-blue-600 to-blue-700 text-white py-3 px-6 rounded-xl font-semibold shadow-lg hover:shadow-xl transition">
                                檢查驗證狀態
                            </button>
                            <button id="back-btn"
                                class="flex-1 bg-gray-200 text-gray-700 py-3 px-6 rounded-xl font-semibold hover:bg-gray-300 transition">
                                返回
                            </button>
                        </div>

                        <div id="checking-status" class="hidden mt-4 p-4 bg-blue-50 text-blue-700 rounded-xl">
                            <div class="flex items-center">
                                <div class="animate-spin rounded-full h-5 w-5 border-b-2 border-blue-600 mr-3"></div>
                                正在檢查驗證狀態...
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Step 3: Download -->
            <div id="step-download" class="step hidden">
                <div class="max-w-3xl mx-auto">
                    <div class="bg-white rounded-2xl shadow-xl p-8">
                        <div class="text-center mb-8">
                            <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                <svg class="w-10 h-10 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                                </svg>
                            </div>
                            <h2 class="text-3xl font-bold text-gray-800 mb-2">證書申請成功！</h2>
                            <p class="text-gray-600">您的SSL證書已準備就緒，請下載以下檔案</p>
                        </div>

                        <div class="grid md:grid-cols-3 gap-6 mb-8">
                            <div class="bg-gray-50 rounded-xl p-6 border-2 border-dashed border-gray-200 hover:border-blue-400 transition">
                                <div class="text-4xl mb-3">📄</div>
                                <h3 class="font-bold text-gray-800 mb-1">Certificate</h3>
                                <p class="text-gray-500 text-sm mb-4">domain.crt</p>
                                <button onclick="downloadFile('cert')"
                                    class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg font-semibold hover:bg-blue-700 transition">
                                    下載
                                </button>
                            </div>
                            <div class="bg-gray-50 rounded-xl p-6 border-2 border-dashed border-gray-200 hover:border-blue-400 transition">
                                <div class="text-4xl mb-3">🔑</div>
                                <h3 class="font-bold text-gray-800 mb-1">Private Key</h3>
                                <p class="text-gray-500 text-sm mb-4">domain.key</p>
                                <button onclick="downloadFile('key')"
                                    class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg font-semibold hover:bg-blue-700 transition">
                                    下載
                                </button>
                            </div>
                            <div class="bg-gray-50 rounded-xl p-6 border-2 border-dashed border-gray-200 hover:border-blue-400 transition">
                                <div class="text-4xl mb-3">🔗</div>
                                <h3 class="font-bold text-gray-800 mb-1">CA Chain</h3>
                                <p class="text-gray-500 text-sm mb-4">domain_chain.crt</p>
                                <button onclick="downloadFile('chain')"
                                    class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg font-semibold hover:bg-blue-700 transition">
                                    下載
                                </button>
                            </div>
                        </div>

                        <button onclick="location.reload()"
                            class="w-full bg-gray-200 text-gray-700 py-3 px-6 rounded-xl font-semibold hover:bg-gray-300 transition">
                            申請新證書
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="bg-gray-800 text-gray-300 py-8">
            <div class="container mx-auto px-4 text-center">
                <p>一鍵免費SSL申請工具 © 2024</p>
            </div>
        </footer>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
